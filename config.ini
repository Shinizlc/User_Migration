[db]
# Юниты каждого POD (порядок не важен). Скрипт сам находит активный (read_only_mode = 0)
# и из имён вычисляет остальное:
#   PRO-ADB252 -> DB link ADB252 (на активный source), PRO-ADB251 -> DB link ADB251 (пассивный),
#   ADB25x -> source POD 25,  ADB23x -> target POD 23.
source_db_units = PRO-ADB251, PRO-ADB252
target_db_units = PRO-ADB231, PRO-ADB232

[paths]
# sql_dir, precopy_sql_dir, work_dir, extdata_bin строятся от release_root автоматически
release_root = /u01/app/oracle/RELEASES/release_25-3_minor-4/2025-09-16_12-23-31_ba365181bd09673ed9f3a7ce9bf196bede86c006/db-usermove

[prep]
vip_code_name = CMR713167
users_file = ./users_to_move.txt
# Необязательно (по умолчанию 0):
# brand_id = 0
# ext_migrate_mss = 1
# ext_migrate_lds = 1
# ext_migrate_hit = 1
# ext_migrate_mds = 1
# ext_migrate_rcv = 1

# ---------------------------------------------------------------------------
# Необязательные переопределения — нужны, только если имена юнитов нестандартные
# или используется старый режим с одиночными TNS-алиасами.
#
# [db]
# source_db_tns = ADB112          ; вместо source_db_units
# target_db_tns = ADB202          ; вместо target_db_units
#
# [links]
# active_src_dblink  = ADB252     ; при source_db_units должен совпадать с активным юнитом
# passive_src_dblink = ADB251
#
# [prep]
# source_pod_id     = 25
# vsched_target_pod = 23
#
# [paths]
# sql_dir         = %(release_root)s/tools/sql
# precopy_sql_dir = %(release_root)s
# work_dir        = %(release_root)s
# extdata_bin     = %(release_root)s/extdata/extdata
#
# [oracle_env]
# tns_admin   = /opt/oracle/network/admin
# oracle_home = /opt/oracle/product/19c
